name: Fetch API logs (debug)

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch server logs
        shell: bash {0}
        run: |
          FTP="ftp://${{ secrets.SMARTERASP_FTP_SERVER }}/${{ secrets.SMARTERASP_FTP_REMOTE_DIR }}"
          AUTH="${{ secrets.SMARTERASP_FTP_USERNAME }}:${{ secrets.SMARTERASP_FTP_PASSWORD }}"
          echo "=== logs/ (listagem) ==="
          curl --silent --user "$AUTH" "${FTP}logs/" || echo "(sem logs/)"
          echo "=== App_Data ==="
          curl --silent --user "$AUTH" "${FTP}App_Data/" || true
          curl --silent --user "$AUTH" "${FTP}App_Data/DataProtection-Keys/" || true
          echo "=== arquivos de log (nomes) ==="
          FILES=$(curl --silent --user "$AUTH" "${FTP}logs/" -l)
          echo "$FILES"
          LAST=$(echo "$FILES" | grep -v keep | tail -2)
          for f in $LAST; do
            echo "===== $f (tail 150) ====="
            curl --silent --user "$AUTH" "${FTP}logs/$f" -o /tmp/log.txt
            tail -150 /tmp/log.txt
          done
