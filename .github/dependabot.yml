version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/crm-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/api-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Caching.Memory"
    ignore:
      # EF Core 10.x requires net10.0; api-core targets net8.0. Grouping bundles
      # PRs but does not pin every package in the group to the same version, so
      # Tools/InMemory (versioned independently of the TFM-gated core packages)
      # jumped to 10.x alone here before, breaking at runtime (MissingMethodException
      # from a mismatched Microsoft.EntityFrameworkCore.Abstractions). Remove once
      # the project moves to net10.0.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">=10.0.0"]
